[project]
name = "open_deep_research"
version = "0.0.16"
description = "Planning, research, and report generation."
authors = [
    { name = "Lance Martin" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10",
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
    "langgraph>=0.5.4",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-deepseek>=0.1.2",
    "langchain-groq>=0.2.4",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.1",
    "langgraph-cli[inmem]>=0.3.1",
    "langgraph-sdk>=0.1.0",
    "langchain-google-vertexai>=2.0.25",
    "langchain-google-genai>=2.1.5",
    "supabase>=2.15.3",
    "mcp>=1.9.4",
    "langchain-aws>=0.2.28",
    "pydantic>=2.7",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24.0",
    "langsmith>=0.3.37",
    "mypy>=1.11.1",
    "pytest>=8.0",
    "ruff>=0.6.1",
]
backend = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["open_deep_research"]

[tool.setuptools.package-dir]
"open_deep_research" = "src/open_deep_research"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
