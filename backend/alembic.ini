# Alembic configuration.
# The database URL is loaded from the DATABASE_URL environment variable in
# backend/alembic/env.py, so sqlalchemy.url is intentionally left empty.
# NOTE: keep this file ASCII-only: Alembic reads it with the system locale codec.
# %(here)s is substituted with the directory that contains this file
# (backend/), so every command works no matter which directory it is run from:
#   cd backend && alembic upgrade head
#   alembic -c backend/alembic.ini upgrade head
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
